name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lane: compiles everything and runs unit + BPMN process tests on in-memory H2.
  # No Docker, so this is the job that should fail first when something is broken.
  build:
    name: Build and fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run fast tests
        run: ./gradlew build -x integrationTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-test-reports
          path: '**/build/reports/tests/test'
      # The generated API contract, so a change to it is visible as a diff in review rather
      # than being discovered by whoever integrates against it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi
          path: engine-flowable/build/openapi.json

  # Slow lane: the same suite against a real Postgres started by Testcontainers.
  # Everything that depends on real row locking (job executor, retries, timers) lives here.
  integration-test:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Run integration tests
        run: ./gradlew integrationTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports
          path: '**/build/reports/tests/integrationTest'

  # Added in Phase 5: starts the stack with docker compose, kicks off an order, restarts the
  # application mid-process and asserts the workflow resumed and completed.
  # restart-recovery:
  #   name: Mid-process restart recovery
  #   runs-on: ubuntu-latest
  #   needs: integration-test
